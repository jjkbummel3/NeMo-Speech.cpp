name: build-windows-cuda

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja + CMake
        run: choco install -y ninja cmake

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: "12.8.0"
          use-github-cache: "false"
          use-local-cache: "true"

      - name: Configure (preset)
        run: cmake --preset cuda-server

      - name: Build (preset)
        run: cmake --build --preset cuda-server --parallel

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Force build\cuda-server\bin\nemo-speech.exe dist\
          Compress-Archive -Path dist\* -DestinationPath nemo-speech-windows-cuda.zip

      - uses: actions/upload-artifact@v4
        with:
          name: nemo-speech-windows-cuda
          path: nemo-speech-windows-cuda.zip
